<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>관리자 · 4반 백과</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><a class="brand" href="index.html">4반 백과</a><nav><a href="index.html">사이트</a></nav></header>
<main class="wrap">
  <section id="loginPanel" class="panel">
    <h1>관리자 로그인</h1>
    <p class="muted">관리자 계정으로 로그인해야 문서를 추가·수정·삭제할 수 있습니다.</p>
    <input id="email" type="email" placeholder="관리자 이메일">
    <input id="password" type="password" placeholder="비밀번호">
    <button id="loginBtn" class="primary">로그인</button>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="editorPanel" class="panel hidden">
    <div class="admin-head"><div><h1>문서 관리</h1><p id="who" class="muted"></p></div><button id="logoutBtn">로그아웃</button></div>
    <div class="editor">
      <input type="hidden" id="docId">
      <label>제목<input id="docTitle" placeholder="예: 우리 반 최고의 밈"></label>
      <label>카테고리<select id="docCategory"><option>밈</option><option>뉴스</option><option>역사</option></select></label>
      <label>내용<textarea id="docContent" rows="16" placeholder="문서 내용을 작성하세요. 줄바꿈은 그대로 표시됩니다."></textarea></label>
      <div class="actions"><button id="newBtn">새 문서</button><button id="saveBtn" class="primary">저장</button></div>
      <p id="saveMsg" class="msg"></p>
    </div>
    <h2>문서 목록</h2>
    <div id="adminDocs" class="doc-list"></div>
  </section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
