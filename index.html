<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>4반 백과</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">4반 백과</a>
  <nav><a href="admin.html" id="adminLink">관리자</a></nav>
</header>
<main class="wrap">
  <section class="hero">
    <h1>4반 백과</h1>
    <p>우리 반의 모든 것을 기록하는 백과사전</p>
    <div class="search"><input id="search" placeholder="문서를 검색하세요"><button id="searchBtn">검색</button></div>
  </section>
  <section class="panel">
    <h2>인기 문서</h2>
    <div id="popular" class="doc-list"><p class="muted">불러오는 중...</p></div>
  </section>
  <section class="panel">
    <h2>카테고리</h2>
    <div class="cats">
      <button data-cat="밈">밈</button><button data-cat="뉴스">뉴스</button><button data-cat="역사">역사</button>
    </div>
    <div id="categoryDocs" class="doc-list"></div>
  </section>
  <section class="panel request">
    <h2>문서 추가 요청</h2>
    <p>새 문서가 필요하면 관리자에게 요청하세요.</p>
    <a href="mailto:YOUR_EMAIL@example.com?subject=4반 백과 문서 추가 요청">문서 추가 요청하기</a>
  </section>
</main>
<footer>4반 백과</footer>
<script type="module" src="app.js"></script>
</body>
</html>
